# =============================================================================
# Configuration nginx pour l'application monopage (SPA)
# =============================================================================

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ┌─ LA RÈGLE INDISPENSABLE POUR UNE SPA ────────────────────────────────┐
    # │ L'application gère ses URL côté navigateur (/login, /tasks…). Ces    │
    # │ chemins n'existent pas sur le disque : seul index.html existe.       │
    # │                                                                       │
    # │ Sans cette règle, naviguer dans l'application fonctionne, mais       │
    # │ RAFRAÎCHIR la page sur /tasks renvoie une 404 — le bug le plus       │
    # │ courant lors du premier déploiement d'une SPA.                        │
    # │                                                                       │
    # │ `try_files` dit : « cherche le fichier, puis le dossier, et à défaut │
    # │ sers index.html » — c'est alors React qui interprète l'URL.          │
    # └───────────────────────────────────────────────────────────────────────┘
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Les fichiers compilés portent une empreinte dans leur nom
    # (index-D9ZiFZD2.js) : leur contenu ne change JAMAIS pour un nom donné.
    # On peut donc les mettre en cache un an sans risque de servir une
    # version périmée.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html, en revanche, ne doit JAMAIS être mis en cache : c'est lui
    # qui désigne les fichiers à charger. Un index.html périmé continuerait
    # de réclamer l'ancienne version après un déploiement.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ─── En-têtes de sécurité ────────────────────────────────────────────────
    # Helmet protège l'API ; ces en-têtes-ci protègent les pages servies au
    # navigateur. Les deux sont nécessaires, ils ne couvrent pas le même
    # périmètre.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;          # anti-« clickjacking »
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Compression : divise environ par trois le poids transféré.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Ne pas annoncer la version exacte de nginx : c'est une information
    # gratuite offerte à qui cherche une faille connue.
    server_tokens off;
}
