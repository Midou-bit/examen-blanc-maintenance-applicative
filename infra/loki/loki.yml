# Configuration Loki — stockage centralisé des journaux (consigne E25).
# Configuration mono-instance, adaptée à une pré-production.

auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Rétention : 30 jours. Au-delà, le disque se remplit sans bénéfice réel —
  # un incident se diagnostique dans les heures qui suivent, pas six mois après.
  retention_period: 720h
  # Accepte les entrées horodatées jusqu'à 168 h dans le passé : utile lors
  # d'un rattrapage après une panne de collecte.
  reject_old_samples: true
  reject_old_samples_max_age: 168h

compactor:
  working_directory: /loki/compactor
  delete_request_store: filesystem
  retention_enabled: true
