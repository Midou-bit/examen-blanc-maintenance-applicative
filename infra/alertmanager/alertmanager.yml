# =============================================================================
# Acheminement des alertes (consigne E26)
# =============================================================================
# Prometheus DÉTECTE les problèmes ; Alertmanager décide QUI est prévenu,
# COMMENT et À QUELLE FRÉQUENCE. Séparer les deux permet de changer les
# destinataires sans toucher aux règles de détection.
# =============================================================================

global:
  resolve_timeout: 5m

route:
  # Regroupe les alertes par nom et par gravité : si trois services tombent
  # en même temps, l'équipe reçoit UN message, pas trois.
  group_by: ['alertname', 'severity']

  # Attendre 30 s avant d'envoyer : laisse le temps aux alertes liées de
  # se déclarer, pour les regrouper dans la même notification.
  group_wait: 30s

  # Délai avant d'ajouter une nouvelle alerte à un groupe déjà notifié.
  group_interval: 5m

  # Ne pas répéter la même alerte avant 4 heures. Sans cela, une panne
  # nocturne produirait des centaines de messages identiques.
  repeat_interval: 4h

  receiver: 'equipe-defaut'

  routes:
    # Les alertes critiques sortent du regroupement habituel : notification
    # immédiate, et rappel toutes les heures tant que ce n'est pas résolu.
    - matchers:
        - severity = "critique"
      receiver: 'equipe-astreinte'
      group_wait: 10s
      repeat_interval: 1h

receivers:
  - name: 'equipe-defaut'
    # En pré-production, on se contente de journaliser (webhook local).
    # En production, on brancherait ici un e-mail, Slack, ou PagerDuty.
    webhook_configs:
      - url: 'http://alertmanager:9093/api/v2/alerts'
        send_resolved: true

  - name: 'equipe-astreinte'
    webhook_configs:
      - url: 'http://alertmanager:9093/api/v2/alerts'
        send_resolved: true
    # EXEMPLE de configuration e-mail, à activer en production :
    # email_configs:
    #   - to: 'astreinte@exemple.fr'
    #     from: 'alertes@exemple.fr'
    #     smarthost: 'smtp.exemple.fr:587'
    #     auth_username: 'alertes@exemple.fr'
    #     auth_password: '${SMTP_PASSWORD}'
    #     headers:
    #       Subject: '[{{ .Status | toUpper }}] {{ .CommonAnnotations.resume }}'

inhibit_rules:
  # Si l'API est totalement indisponible, inutile d'alerter aussi sur la
  # latence et le taux d'erreur : ce sont des conséquences, pas des causes.
  # Cette règle évite de noyer le vrai message sous les symptômes.
  - source_matchers:
      - alertname = "ApiIndisponible"
    target_matchers:
      - alertname =~ "LatenceElevee|TauxErreurEleve"
    equal: ['environnement']
